# Lab Postgres → existing Render Postgres.
# Media rsync is a separate host path. This workflow does not pack media
# and does not change data-release.yml.
#
# SYNC_MODE=dump|logical. Default dump (dump/restore path).
# logical is optional and is not configured on this public workflow
# (no-op skip). A private env may set SYNC_MODE=logical later; do not
# embed host wiring here.
#
# Dump source: the lab ExitTrace database, via a host helper whose path
# is supplied at runtime (ET_LAB_DUMP_SH / ET_LAB_DUMP_OUT).
#
# GitHub Actions cron is UTC and does not honor a TZ key.
# cron 0 */2 * * * fires at minute 0 of every even UTC hour
# (00:00, 02:00, 04:00, …, 22:00 UTC).
# America/New_York intent: every 2 hours in Eastern Time.
#   EDT (UTC-4): 8:00pm, 10:00pm, 12:00am, 2:00am, …, 6:00pm ET
#   EST (UTC-5): 7:00pm, 9:00pm, 11:00pm, 1:00am, …, 5:00pm ET
#
# Restore reads DATABASE_URL only from the GitHub Actions environment
# named production (Render External connection string). Never put that
# URL on the dump-runner host or in this repository.

name: lab-to-render-sync

on:
  workflow_dispatch:
    inputs:
      SYNC_MODE:
        description: Sync mode. dump is the default dump/restore path. logical is optional and not configured on this public workflow.
        type: choice
        required: false
        default: dump
        options:
          - dump
          - logical
  schedule:
    - cron: "0 */2 * * *"

concurrency:
  group: lab-to-render-sync
  cancel-in-progress: false

permissions:
  contents: none

jobs:
  mode:
    name: resolve-sync-mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sync_mode: ${{ steps.resolve.outputs.sync_mode }}
    steps:
      - id: resolve
        name: Resolve SYNC_MODE (default dump)
        env:
          SYNC_MODE_INPUT: ${{ inputs.SYNC_MODE }}
          SYNC_MODE_VAR: ${{ vars.SYNC_MODE }}
        run: |
          set -euo pipefail
          mode="${SYNC_MODE_INPUT:-${SYNC_MODE_VAR:-dump}}"
          case "$mode" in
            dump|logical) ;;
            *)
              echo "SYNC_MODE must be dump or logical (default dump)."
              exit 1
              ;;
          esac
          echo "sync_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "SYNC_MODE=$mode"

  dump:
    name: dump
    needs: mode
    if: needs.mode.outputs.sync_mode == 'dump'
    # Runner labels are env-configurable. Default generic labels:
    # self-hosted, lab. Override with repository variable
    # ET_LAB_RUNNER_LABELS (JSON array) to match your runner.
    runs-on: ${{ fromJSON(vars.ET_LAB_RUNNER_LABELS || '["self-hosted","lab"]') }}
    # No production / Render secrets on this job.
    timeout-minutes: 20
    steps:
      - name: Dump lab Postgres
        env:
          # Set on the runner and/or as repository variables.
          # Placeholder examples (not a real host):
          #   ET_LAB_DUMP_SH=/path/to/et-lab-dump.sh
          #   ET_LAB_DUMP_OUT=/path/to/exittrace-lab-latest.dump
          ET_LAB_DUMP_SH_FROM_VARS: ${{ vars.ET_LAB_DUMP_SH }}
          ET_LAB_DUMP_OUT_FROM_VARS: ${{ vars.ET_LAB_DUMP_OUT }}
        run: |
          set -euo pipefail
          DUMP_SH="${ET_LAB_DUMP_SH:-${ET_LAB_DUMP_SH_FROM_VARS:-}}"
          LATEST="${ET_LAB_DUMP_OUT:-${ET_LAB_DUMP_OUT_FROM_VARS:-}}"
          if [[ -z "$DUMP_SH" || ! -x "$DUMP_SH" ]]; then
            echo "ET_LAB_DUMP_SH is unset or not executable; refusing to dump."
            exit 1
          fi
          if [[ -z "$LATEST" ]]; then
            echo "ET_LAB_DUMP_OUT is unset; refusing to dump."
            exit 1
          fi
          "$DUMP_SH"
          if [[ ! -e "$LATEST" ]]; then
            echo "dump script did not update $LATEST"
            exit 1
          fi
          resolved="$(readlink -f -- "$LATEST")"
          if [[ ! -s "$resolved" ]]; then
            echo "resolved dump is missing or empty"
            exit 1
          fi
          gzip -c -- "$resolved" > "${RUNNER_TEMP}/exittrace-lab.dump.gz"
          ls -lh -- "${RUNNER_TEMP}/exittrace-lab.dump.gz"

      - name: Upload compressed dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: exittrace-lab-dump
          path: ${{ runner.temp }}/exittrace-lab.dump.gz
          retention-days: 1
          if-no-files-found: error

  restore:
    name: restore
    needs: dump
    if: needs.dump.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Require production DATABASE_URL
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "GitHub environment 'production' secret DATABASE_URL is not set"
            exit 1
          fi

      - name: Download dump artifact
        uses: actions/download-artifact@v4
        with:
          name: exittrace-lab-dump
          path: dump

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-client

      - name: Restore lab dump into Render Postgres
        run: |
          set -euo pipefail
          set +x
          redact() {
            sed -E \
              -e 's#[A-Za-z0-9+._~:/?#\[\]@!$&'"'"'()*+,;=-]+://[^[:space:]]+#[redacted-url]#g' \
              -e 's#\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b#[redacted]#g'
          }
          ensure_ssl() {
            local u="${1:-}"
            if [[ "$u" == *sslmode=* ]]; then
              printf '%s' "$u"
            elif [[ "$u" == *\?* ]]; then
              printf '%s&sslmode=require' "$u"
            else
              printf '%s?sslmode=require' "$u"
            fi
          }

          if [[ ! -s dump/exittrace-lab.dump.gz ]]; then
            echo "artifact dump/exittrace-lab.dump.gz is missing or empty"
            exit 1
          fi

          work="${RUNNER_TEMP}/exittrace-lab.dump"
          gzip -dc dump/exittrace-lab.dump.gz > "$work"
          target="$(ensure_ssl "$DATABASE_URL")"
          unset DATABASE_URL
          export PGSSLMODE=require

          err="${RUNNER_TEMP}/pg_restore.err"
          if ! pg_restore \
            --clean \
            --if-exists \
            --no-owner \
            --no-acl \
            --exit-on-error \
            --dbname="$target" \
            "$work" 2>"$err"; then
            redact < "$err" >&2 || true
            rm -f -- "$work" "$err"
            exit 1
          fi
          redact < "$err" >&2 || true

          if ! psql --no-psqlrc --dbname="$target" -v ON_ERROR_STOP=1 -At -c \
            "SELECT 'people=' || (SELECT count(*) FROM people) ||
                    ' dog_comms=' || (SELECT count(*) FROM dog_comms) ||
                    ' operations=' || (SELECT count(*) FROM operations) ||
                    ' source_posts=' || (SELECT count(*) FROM source_posts);" \
            >"${RUNNER_TEMP}/restore.counts" 2>"$err"; then
            redact < "$err" >&2 || true
            rm -f -- "$work" "$err"
            exit 1
          fi
          cat "${RUNNER_TEMP}/restore.counts"
          rm -f -- "$work" "$err" "${RUNNER_TEMP}/restore.counts"

  logical:
    name: logical
    needs: mode
    if: needs.mode.outputs.sync_mode == 'logical'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Optional logical replica is not configured here
        run: |
          set -euo pipefail
          echo "SYNC_MODE=logical: optional logical replica is not configured on this public workflow. Skipping."
