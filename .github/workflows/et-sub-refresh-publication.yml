name: et-sub-refresh-publication

# One-shot Admiral SIGN + Worf PASS WITH CONDITIONS 2026-09-16:
# ALTER SUBSCRIPTION exittrace_lab_sub REFRESH PUBLICATION WITH (copy_data = false)
# No DROP. No other subs. No copy_data=true. No media wipe. No leftover touch.

on:
  workflow_dispatch:

concurrency:
  group: et-sub-refresh-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: refresh-pub-copy-data-false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Install psql
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Assert sub + REFRESH copy_data=false + before/after sub_rel
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          export PGOPTIONS='-c client_min_messages=warning'
          SUB=exittrace_lab_sub
          # Hard assert: only this subscription exists under expected name
          got=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT subname FROM pg_subscription WHERE subname='${SUB}';")
          echo "assert_subname=${got}"
          test "$got" = "$SUB"
          # Refuse if any other unexpected mutate target would be implied (name must match exactly)
          echo "=== BEFORE ==="
          before=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*) FROM pg_subscription_rel sr
            JOIN pg_subscription s ON s.oid = sr.srsubid
            WHERE s.subname='${SUB}';
          ")
          echo "sub_rel_before=${before}"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT subname, subenabled, subslotname, subpublications FROM pg_subscription WHERE subname='${SUB}';"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT subname, pid, received_lsn, latest_end_lsn, last_msg_receipt_time FROM pg_stat_subscription WHERE subname='${SUB}';"
          # Exact mutate — copy_data=false ONLY (never true / never omit into default true)
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER SUBSCRIPTION exittrace_lab_sub REFRESH PUBLICATION WITH (copy_data = false);"
          echo "REFRESH_OK copy_data=false"
          # Give apply a moment to register relations
          sleep 5
          echo "=== AFTER ==="
          after=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*) FROM pg_subscription_rel sr
            JOIN pg_subscription s ON s.oid = sr.srsubid
            WHERE s.subname='${SUB}';
          ")
          echo "sub_rel_after=${after}"
          if [ "$after" = "0" ]; then
            echo "FAIL: pg_subscription_rel still 0 after REFRESH"
            exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            SELECT c.relname, sr.srsubstate,
              CASE sr.srsubstate
                WHEN 'i' THEN 'initialize'
                WHEN 'd' THEN 'data-copy'
                WHEN 'f' THEN 'finished-copy'
                WHEN 's' THEN 'synchronized'
                WHEN 'r' THEN 'ready'
                ELSE sr.srsubstate::text
              END AS state_name
            FROM pg_subscription_rel sr
            JOIN pg_class c ON c.oid = sr.srrelid
            JOIN pg_subscription s ON s.oid = sr.srsubid
            WHERE s.subname='${SUB}'
            ORDER BY c.relname;
          "
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT subname, subenabled FROM pg_subscription WHERE subname='${SUB}';"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT subname, pid, received_lsn, latest_end_lsn, last_msg_receipt_time FROM pg_stat_subscription WHERE subname='${SUB}';"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "
            SELECT 'people='||count(*) FROM people;
            SELECT 'dog_comms='||count(*) FROM dog_comms;
            SELECT 'et_meta='||count(*) FROM et_meta;
          "
          echo "SUB_REFRESH_OK before=${before} after=${after}"
