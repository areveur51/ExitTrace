name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - name: Start throwaway loopback Postgres
        # Distro postgresql package. postgres --version is the engine this job ran.
        # It is not the Render server version.
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql
          PG=$(ls -d /usr/lib/postgresql/*/bin | sort | tail -1)
          "$PG/initdb" -D "$RUNNER_TEMP/et-scratch-pg" --auth=trust --username=postgres --encoding=UTF8 --locale=C
          printf "\nlisten_addresses = '127.0.0.1'\nport = 54329\nunix_socket_directories = '/tmp'\n" >> "$RUNNER_TEMP/et-scratch-pg/postgresql.conf"
          "$PG/pg_ctl" -D "$RUNNER_TEMP/et-scratch-pg" -l "$RUNNER_TEMP/et-scratch-pg.log" -w start
          "$PG/postgres" --version
          "$PG/createdb" -h 127.0.0.1 -p 54329 -U postgres scratchboot
          "$PG/createdb" -h 127.0.0.1 -p 54329 -U postgres scratchrel
      - name: Real Postgres scratch tests
        run: |
          ET_SCRATCH_PG_URL=postgres://127.0.0.1:54329/scratchboot node --test --test-concurrency=1 tests/bootstrap-stripped-pg.test.mjs
          ET_SCRATCH_PG_URL=postgres://127.0.0.1:54329/scratchrel node --test --test-concurrency=1 tests/relationship-a-label.test.mjs
